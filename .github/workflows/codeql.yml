name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code.
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    permissions:
      # Required by CodeQL to upload results.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # JavaScript/TypeScript covers src/, electron/ and renderer/.
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          # Actions workflows are code too: a compromised workflow can exfiltrate
          # secrets or push to main.
          - language: actions
            os: ubuntu-latest
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-and-quality is stricter than the default security set and is
          # appropriate for code that handles cryptographic material.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
