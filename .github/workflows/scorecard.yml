name: Scorecard

# OpenSSF Scorecard checks supply-chain hygiene: branch protection, code review,
# pinned dependencies, token permissions. It is a useful independent audit of
# whether the protections we configured are actually in force.

on:
  branch_protection_rule:
  schedule:
    - cron: '15 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Allows Scorecard to read branch protection rules, which is exactly
          # what we want it to verify.
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
